<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 도구 안내서</title>
  <meta name="description" content="분야별 AI 서비스를 직접 써보고 장점과 아쉬운 점을 정리한 안내서">
  <meta name="theme-color" content="#2A7BE4">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>

  <div class="top">
    <header class="container site-header">
      <a class="site-logo" href="index.html">
        <img src="assets/favicon.svg" alt="">AI 도구 안내서
      </a>
      <nav class="nav" aria-label="주 메뉴">
        <a href="index.html" aria-current="page">서비스 목록</a>
        <a href="about.html">소개</a>
      </nav>
    </header>

    <!-- 제목 주변에 떠 있는 서비스 로고 (main.js가 채움) -->
    <div class="floating-logos" id="floating-logos" aria-hidden="true"></div>

    <section class="container hero" id="hero">
      <h1 class="hero-title">
        직접 써보고 정리한
        <span class="hero-title-accent">AI 도구 <span id="total-count"></span>개</span>
      </h1>
      <p class="hero-desc">
        리서치부터 디자인, 코딩, 회의록까지 분야별로 골라 보고<br>
        장점과 아쉬운 점, 비용, 직접 써본 소감까지 한 번에 확인하세요
      </p>
      <div class="hero-cta">
        <a class="btn btn-primary btn-lg" href="#main">서비스 둘러보기</a>
      </div>
    </section>
  </div>

  <!-- 스크롤해도 화면 위에 붙어 있는 검색·분야 막대 -->
  <div class="toolbar">
    <div class="container toolbar-inner">
      <form class="search" role="search">
        <label for="search-input" class="visually-hidden">서비스 검색</label>
        <input type="search" id="search-input" placeholder="이름이나 용도로 검색" autocomplete="off">
      </form>
      <div class="chips" id="category-tabs" role="group" aria-label="분야 선택"></div>
    </div>
  </div>

  <main id="main" class="container list-section">
    <p class="result-count" id="result-count" aria-live="polite"></p>
    <div id="service-list"></div>

    <div class="empty" id="empty-state" hidden>
      <p>조건에 맞는 서비스가 없습니다. 검색어를 바꾸거나 필터를 초기화하세요.</p>
      <button type="button" class="btn" id="reset-filters">필터 초기화</button>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>AI 도구 안내서</span>
      <span>비용 정보는 바뀔 수 있으니 공식 사이트에서 확인하세요.</span>
    </div>
  </footer>

  <script src="js/services.js"></script>
  <script src="js/render.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
